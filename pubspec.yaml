name: ocr_expense_tracker
description: "A modern Flutter OCR Expense Tracker Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  google_mlkit_text_recognition: ^0.17.1
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  sqflite: ^2.4.4
  path: ^1.9.1
  google_mlkit_barcode_scanning: ^0.16.1
  image_cropper: ^12.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true